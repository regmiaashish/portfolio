<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aashish Regmi, Backend &amp; AI engineer</title>
    <meta
      name="description"
      content="Aashish Regmi is a backend and AI engineer in Kathmandu building FastAPI services, LLM integrations and the infrastructure that keeps them running."
    />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1524" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply a saved theme before first paint so there is no flash of the wrong colours.
      // Keep the storage key in sync with THEME_STORAGE_KEY in src/hooks/useTheme.ts.
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
